<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор · Список желаний</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="./app.js"></script>
</head>
<body data-editor>
  <header class="topline">
    <nav class="container d-flex flex-wrap align-items-center gap-2 py-3">
      <a class="brand" href="/">♡ Список желаний Агаты</a>
      <div class="d-flex flex-wrap gap-2 ms-auto">
        <button type="button" class="btn btn-primary" id="add-gift">Добавить подарок</button>
        <button type="button" class="btn btn-secondary" id="export-gifts">Экспортировать для публикации</button>
        <a class="btn btn-secondary" href="/wishlist.html">Предпросмотр ↗</a>
      </div>
    </nav>
  </header>
  <main class="container pt-4 pb-5">
    <p id="notice" class="text-danger" role="status" hidden></p>
    <p id="empty" class="empty">Добавьте ссылку на первый подарок.</p>
    <div id="gifts" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </main>
  <button type="button" class="btn back-to-top" id="back-to-top" hidden>↑ Наверх</button>
  <template id="gift-template">
    <div class="col">
      <article class="card h-100 overflow-hidden">
        <div class="gift-media">
          <span class="placeholder-icon" aria-hidden="true">♡</span>
          <img data-photo hidden alt="">
        </div>
        <div class="card-body d-flex flex-column gap-2">
          <h3 class="h5 mb-0 text-break gift-title" data-title></h3>
          <div class="gift-price fw-medium" data-price></div>
          <p class="mb-0 pt-2 fw-medium">Оценка Агаты</p>
          <div class="rating" role="group" aria-label="Оценка Агаты">
            <button type="button" class="btn btn-outline-primary rating-dream" data-rating="4" aria-pressed="false">🌟 Мечтаю больше всего</button>
            <button type="button" class="btn btn-outline-primary" data-rating="3" aria-label="Три сердца" aria-pressed="false">♥♥♥</button>
            <button type="button" class="btn btn-outline-primary" data-rating="2" aria-label="Два сердца" aria-pressed="false">♥♥</button>
            <button type="button" class="btn btn-outline-primary" data-rating="1" aria-label="Одно сердце" aria-pressed="false">♥</button>
          </div>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-info" data-edit>Редактировать</button>
            <button type="button" class="btn btn-sm btn-secondary" data-delete>Удалить</button>
            <a class="btn btn-sm btn-primary ms-auto" data-store target="_blank" rel="noopener noreferrer">В магазин</a>
          </div>
        </div>
      </article>
    </div>
  </template>
  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <div class="d-flex align-items-center justify-content-between gap-3 p-3 border-bottom">
      <h2 class="h4 mb-0" id="edit-heading">Редактировать подарок</h2>
      <button type="button" class="btn-close btn-close-white" id="close-edit" aria-label="Закрыть"></button>
    </div>
    <form id="edit-form" novalidate>
      <div class="p-3">
        <label class="form-label" for="product-url">Ссылка на товар</label>
        <input class="form-control mb-3" id="product-url" name="url" type="url" placeholder="https://…" required>
        <label class="form-label" for="gift-title">Название</label>
        <input class="form-control mb-3" id="gift-title" name="title" maxlength="250">
        <label class="form-label" for="gift-price">Цена</label>
        <input class="form-control mb-3" id="gift-price" name="price" maxlength="80" placeholder="Например, 1 990 ₽">
        <label class="form-label" for="gift-image">Ссылка на фото</label>
        <input class="form-control mb-3" id="gift-image" name="image" type="url" placeholder="https://…">
        <label class="form-label" for="gift-file">Или загрузите фото</label>
        <input class="form-control mb-2" id="gift-file" name="file" type="file" accept="image/*">
        <div class="form-check mb-3" id="remove-photo-row" hidden>
          <input class="form-check-input" type="checkbox" id="remove-photo" name="removePhoto">
          <label class="form-check-label" for="remove-photo">Удалить текущее фото</label>
        </div>
        <p id="edit-error" role="alert" class="text-danger" hidden></p>
      </div>
      <div class="d-flex gap-2 justify-content-end p-3 border-top">
        <button class="btn btn-secondary" type="button" id="cancel-edit">Отмена</button>
        <button class="btn btn-primary" type="submit" id="save-edit">Сохранить</button>
      </div>
    </form>
  </dialog>
</body>
</html>
