<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список желаний Агаты</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
  <script defer src="./booking.js"></script>
</head>
<body>
  <header class="topline">
    <nav class="container d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
      <a class="brand" href="./">♡ Список желаний Агаты</a>
      <a class="btn btn-secondary" href="./" data-editor-link>← В редактор</a>
    </nav>
  </header>
  <main class="container">
    <section class="hero">
      <p class="mb-0">Самые желанные подарки в начале списка.</p>
    </section>
    <p id="booking-notice" role="status" hidden></p>
    <p id="notice" class="text-danger" role="status" hidden></p>
    <p id="empty" class="empty" hidden>Здесь появятся подарки из редактора.</p>
    <div id="gifts" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"></div>
  </main>
  <button type="button" class="btn back-to-top" id="back-to-top" hidden>↑ Наверх</button>
  <template id="gift-template">
    <div class="col">
      <article class="card h-100 overflow-hidden">
        <div class="gift-media">
          <span class="placeholder-icon" aria-hidden="true">♡</span>
          <img data-photo hidden alt="">
        </div>
        <div class="card-body d-flex flex-column gap-2">
          <h3 class="h5 mb-0 text-break gift-title" data-title></h3>
          <div class="gift-price fw-medium" data-price></div>
          <div class="d-flex align-items-baseline gap-2" data-guest-rating hidden>
            <div class="small text-body-secondary">Степень желанности</div>
            <div class="guest-rating fw-bold" data-hearts></div>
          </div>
          <div class="d-flex flex-wrap gap-2 align-self-start mw-100 mt-auto">
            <p class="bs-component">
              <button type="button" class="btn btn-primary" data-reserve disabled>Забронировать</button>
              <a class="btn btn-light" data-store target="_blank" rel="noopener noreferrer">Открыть в магазине</a>
            </p>
          </div>
        </div>
      </article>
    </div>
  </template>
</body>
</html>
